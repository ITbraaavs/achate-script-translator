<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Script Translator — Dutch/German → English</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --line: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --green: #3ad29f;
    --danger: #ff5f6d;
    --english: #15211b;
  }

  :root[data-theme="light"] {
    --bg: #fff;
    --panel: #f5f7fa;
    --panel2: #eaeef4;
    --line: #d4dae3;
    --text: #1b2330;
    --muted: #5d6b80;
    --accent: #2563eb;
    --green: #0d9488;
    --danger: #dc2626;
    --english: #edfaf4;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }

  header h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 12.5px;
  }

  #themeBtn {
    margin-left: auto;
  }

  main {
    padding: 24px;
  }

  textarea {
    width: 100%;
    min-height: 170px;
    padding: 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
  }

  button,
  select {
    padding: 9px 14px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
  }

  button:hover,
  select:hover {
    border-color: var(--accent);
  }

  button.primary {
    color: white;
    background: var(--accent);
    border-color: var(--accent);
  }

  button.green {
    color: #06281c;
    background: var(--green);
    border-color: var(--green);
  }

  button:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .hint,
  .status {
    color: var(--muted);
    font-size: 12px;
  }

  .status {
    min-height: 20px;
    margin: 8px 0;
  }

  .status.ok {
    color: var(--green);
  }

  .status.error {
    color: var(--danger);
  }

  .progress {
    display: none;
    height: 6px;
    overflow: hidden;
    background: var(--panel2);
    border-radius: 6px;
  }

  .progress div {
    width: 0;
    height: 100%;
    background: var(--accent);
  }

  .exports {
    display: none;
  }

  .table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
  }

  th,
  td {
    padding: 9px 11px;
    text-align: left;
    vertical-align: top;
    border: 1px solid var(--line);
  }

  th {
    color: var(--muted);
    background: var(--panel2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  td.number {
    color: var(--accent);
    font-weight: 650;
    white-space: nowrap;
  }

  td.type {
    color: var(--muted);
    white-space: nowrap;
  }

  td.english {
    background: var(--english);
  }

  td[contenteditable]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  footer {
    margin-top: 30px;
    padding: 16px;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--line);
  }

  @media print {
    header,
    textarea,
    .toolbar,
    .hint,
    .status,
    .progress,
    footer {
      display: none !important;
    }

    main {
      padding: 0;
    }

    table {
      color: black;
      background: white;
    }

    th,
    td {
      color: black !important;
      background: white !important;
      border: 1px solid #aaa;
    }
  }
</style>
</head>

<body>

<header>
  <h1>📝 Script Translator</h1>
  <span class="subtitle" id="subtitle"></span>
  <button id="themeBtn">🌙 Dark</button>
</header>

<main>
  <textarea id="input"></textarea>

  <div class="toolbar">
    <select id="languageSelect" aria-label="Translation language">
      <option value="nl">Dutch → English</option>
      <option value="de">German → English</option>
    </select>

    <button class="primary" id="parseBtn">
      ① Parse script
    </button>

    <button class="green" id="translateBtn" disabled>
      ② Translate to English
    </button>

    <button id="sampleBtn">Load sample</button>
    <button id="clearBtn">Clear</button>
  </div>

  <p class="hint" id="layoutHint"></p>

  <div class="progress" id="progress">
    <div></div>
  </div>

  <div class="status" id="status"></div>

  <div class="toolbar exports" id="exports">
    <button id="copyTableBtn">📋 Copy for Google Docs</button>
    <button class="green" id="elevenBtn">🎙️ Copy Script for ElevenLabs</button>
    <button id="copyTsvBtn">Copy as TSV</button>
    <button id="srtBtn">🎬 Generate SRT</button>
    <button id="pdfBtn">⬇️ Download PDF</button>
    <button id="saveBtn">💾 Save edits</button>
  </div>

  <div class="table-wrapper" id="tableWrapper"></div>
</main>

<footer>
  Created by <strong>christinebravo</strong>
</footer>

<script>

Type
